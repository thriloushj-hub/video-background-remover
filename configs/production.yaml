io:
  input_dir: inputs
  output_dir: results
  output_mode: all
  green:
  - 0
  - 177
  - 64
  max_size: null
  crf: 16
  save_frames: false
  strict_frame_count: true
  edge_finish: hard_round
  edge_threshold: 0.5
  edge_round_sigma: 2.0
  edge_aa_sigma: 1.5
  edge_morph_px: 8
shots:
  enabled: true
  cut_threshold: 0.35
  hist_bins: 64
  min_shot_len: 12
  use_absdiff_guard: true
  absdiff_sigma: 6.0
detect:
  model: yolov8x.pt
  conf: 0.25
  iou: 0.5
  person_rel_size_min: 0.6
  person_rel_area_min: 0.2
  box_score_ratio: 0.15
  conf_abs_min: 0.5
  duplicate_box_contain_max: 0.8
  duplicate_mask_contain_max: 0.7
  reseed_every: 12
  reseed_overlap_max: 0.3
  device: auto
seed:
  backend: maskrcnn
  extend_tail_max: 0.0
  lookahead_frames: 4
  lookahead_min_tail: 0.15
  lookahead_min_gain: 0.1
  lookahead_require_same_cast: true
  maskrcnn_score_min: 0.8
  maskrcnn_match_iou: 0.3
  maskrcnn_recover: true
  maskrcnn_recover_score_min: 0.35
  maskrcnn_mask_binarise: 0.5
  maskrcnn_mask_recover: false
  maskrcnn_mask_recover_binarise: 0.25
  maskrcnn_mask_recover_min_tail: 0.05
  maskrcnn_mask_recover_max_spill: 1.5
  maskrcnn_edge_pad: 64
  seam_sam: true
  seam_sam_close: 121
  seam_sam_model: sam2.1_b.pt
  maskrcnn_edge_pad_band: true
  mask_threshold: 0.0
  detect_threshold: 0.35
  concept_text: person
  concept_text_detect: true
  concept_match_iou: 0.4
  force_interactive: true
  interactive_mask_threshold: 0.0
  box_clip_margin: 8
  gate_background_regions: true
  gate_bg_margin: 0.1
  fill_mask_holes: true
  gap_fill: true
  gap_bg_margin: 0.12
  gap_min_area: 64
  gap_max_frac: 0.05
matting:
  engine: sam2matting
  checkpoint: checkpoints/SAM2Matting-SAM3.pt
  repo_dir: third_party/SAM2Matting
  device: auto
  half: true
  n_warmup_static: 10
  n_warmup_motion: 10
  r_erode: 0
  r_dilate: 6
  drift_anchor_warmup: true
  max_permanent_anchors: 24
  strict_capabilities: false
  person_objects: both
  hybrid_edge: false
  hybrid_band_px: 6
  hybrid_strong: 0.6
  bottom_pocket: false
  bottom_pocket_gap: 300
  bottom_pocket_hmax: 200
  bottom_pocket_gate: 0.5
  bottom_smooth: false
  bottom_smooth_frac: 0.7
  bottom_smooth_w: 3
track_health:
  enabled: true
  max_area_ratio: 1.6
  min_area_ratio: 0.55
  min_flow_iou: 0.55
  min_area_frac: 0.0008
  lost_after: 8
motion:
  enabled: true
  flow_method: dis
  flow_scale_short_side: 480
  trimap_base: 4.0
  trimap_flow_gain: 0.9
  trimap_max: 40.0
  flow_smooth_sigma: 9.0
  high_motion_px: 6.0
  warp_prior_weight: 0.5
  warp_consistency_thresh: 18.0
reid:
  enabled: true
  model: facebook/dinov3-vitb16-pretrain-lvd1689m
  device: auto
  pool_size: 12
  match_threshold: 0.62
  new_identity_threshold: 0.45
  scan_every: 8
  max_overlap: 0.35
  mask_max_overlap: 0.5
  min_area_frac: 0.0015
  recheck_with_mask: true
  gate_recovery_to_silhouette: false
  gate_dilate_px: 40
  stitch_radius: 6
refine:
  band_refine: true
  temporal_filter: true
  temporal_alpha: 0.35
  guided_filter: true
  guided_radius: 4
  guided_eps: 0.0001
  core_solidify: false
  core_solidify_thresh: 0.25
  core_solidify_radius_frac: 0.00625
  core_solidify_floor: 0.05
  post_stabilize: 0.8
  post_stabilize_still_px: 6.0
decontam:
  enabled: true
  regularization: 1.0e-05
  n_small_iterations: 20
  n_big_iterations: 3
  small_size: 32
  band_only: true
  band_lo: 0.02
  band_hi: 0.98
seed_value: 0
verbose: true
