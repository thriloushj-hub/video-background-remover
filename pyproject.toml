[project]
name = "vbgr2"
version = "2.0.0"
description = "Video background remover: decoupled tracking + matting, with re-entry, motion-blur and drift fixes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "scipy>=1.10", "PyYAML>=6.0"]

[project.optional-dependencies]
gpu = ["torch>=2.4", "torchvision>=0.19", "ultralytics>=8.3",
       "transformers>=4.44", "iopath", "tqdm", "imageio", "imageio-ffmpeg"]

[project.scripts]
vbgr2 = "vbgr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vbgr*", "bench*"]
